name: Update profile
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [now.md, 'scripts/**', 'tests/**', .github/workflows/update.yml]
permissions:
  contents: read
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
      - run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed content
        run: |
          git add README.md assets data
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile content"
          git push
