ica Neue',Arial,sans-serif" font-size="13.5" fill="#AAB8CA">home servers. Three themes, no telemetry.</text><text x="544" y="454" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#91B8E8" letter-spacing="1">VUE · FORK OF CASAOS-UI</text><text x="48" y="498" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8A99AE" letter-spacing="2">W1TNEESS / BUILD • LEARN • REPEAT</text><rect x=".5" y=".5" width="999" height="519" rx="21.5" stroke="#C4D2E8" stroke-opacity="0.16"/></svg>
