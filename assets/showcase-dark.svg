" font-size="26" fill="#F4F5F7">Osho Documentary</text><text x="76" y="224" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#AAB8CA">Evidence-graded archive on Osho and Rajneeshpuram,</text><text x="76" y="244" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#AAB8CA">with an archival timeline and map.</text><text x="76" y="264" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#91B8E8" letter-spacing="1">NEXT.JS · TYPESCRIPT</text><rect x="516" y="112" width="436" height="168" rx="14" fill="#171D28" stroke="#34465E" filter="url(#lift)"/><g transform="translate(892 164) scale(.85)"><rect x="-33" y="-35" width="66" height="70" rx="12" fill="#D9C08E" fill-opacity=".1" stroke="#D9C08E" stroke-opacity=".5"/><path d="M-17 18L0 -19L17 18M-11 6H11" stroke="#D9C08E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="544" y="150" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D6B77F" letter-spacing="2">02 / WINDOWS APP</text><text x="544" y="192" font-family="Georgia,'Noto Serif','DejaVu Serif','Times New Roman',serif" font-size="26" fill="#F4F5F7">Declutter</text><text x="544" y="224" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#AAB8CA">Sorts a messy folder and finds duplicates.</text><text x="544" y="244" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#AAB8CA">Previews first. Never permanently deletes.</text><text x="544" y="264" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#91B8E8" letter-spacing="1">PYTHON</text><rect x="48" y="302" width="436" height="168" rx="14" fill="#171D28" stroke="#34465E" filter="url(#lift)"/><g transform="translate(424 354) scale(.85)"><rect x="-33" y="-35" widt